name: APK Mostralo Pedidos

on:
  workflow_dispatch:
  push:
    branches: ['app-pedidos-*']
    paths: ['mobile/pedidos/**', '.github/workflows/android-pedidos.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/pedidos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependências e testes
        run: |
          npm ci
          npm test
          npm run build
      - name: Projeto Android
        run: |
          npx cap add android
          cp android-template/MainActivity.java android/app/src/main/java/br/com/mostralo/pedidos/MainActivity.java
          python3 android-template/patch-manifest.py android/app/src/main/AndroidManifest.xml
          mkdir -p resources && cp android-template/icon-only.png resources/icon-only.png
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#F26B1D' --splashBackgroundColor '#F26B1D' || echo "ícone padrão"
          npx cap sync android
      - name: Gerar APK
        working-directory: mobile/pedidos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mostralo-pedidos-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mostralo-pedidos-apk
          path: mobile/pedidos/mostralo-pedidos-teste.apk
          retention-days: 30

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Content Security Policy - COM unsafe-eval para Vite
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://noshwvwpjtnvndokbfjx.supabase.co wss://noshwvwpjtnvndokbfjx.supabase.co https://www.google-analytics.com https://api.mapbox.com https://*.supabase.co wss://*.supabase.co; frame-src 'self' https:; worker-src 'self' blob:;" always;

        # Cache control
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Service Worker - sem cache
        location = /sw.js {
            add_header Service-Worker-Allowed "/" always;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri =404;
        }

        # Sitemap XML - proxy para Edge Function
        location = /sitemap.xml {
            proxy_pass https://noshwvwpjtnvndokbfjx.supabase.co/functions/v1/sitemap;
            proxy_ssl_server_name on;
            proxy_set_header Host noshwvwpjtnvndokbfjx.supabase.co;
            proxy_set_header Accept "application/xml";
            add_header Content-Type "application/xml; charset=utf-8" always;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # Detectar crawlers e redirecionar para Edge Function de preview
        location ~ ^/loja/(.+)$ {
            set $store_slug $1;
            set $is_crawler 0;
            
            # Detectar crawlers de redes sociais
            if ($http_user_agent ~* "(WhatsApp|facebookexternalhit|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot)") {
                set $is_crawler 1;
            }
            
            # Redirecionar crawlers para Edge Function
            if ($is_crawler = 1) {
                return 302 https://noshwvwpjtnvndokbfjx.supabase.co/functions/v1/store-og-preview?slug=$store_slug;
            }
            
            # Usuários normais seguem para o SPA
            try_files $uri $uri/ /index.html;
        }

        # SPA fallback para outras rotas
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
